name: Proposer une ressource publique
description: Suggérer un lien public vers une vidéo, un article, une fiche ou un cours. Ne transmettez aucune donnée personnelle.
title: "[Ressource] "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **Formulaire public.** Tout contenu soumis sera visible sur Internet, associé à votre compte GitHub. Ne renseignez aucune donnée personnelle, confidentielle, médicale ou relative à un allocataire RSA ; aucun témoignage de bénéficiaire.

        Une proposition n'est pas publiée automatiquement. Elle passe par une revue de provenance et de concordance expliquée dans **« Le vendeur de kebab »** : https://muse-irs.github.io/muze-x-emotions-open-resources/le-vendeur-de-kebab.html
  - type: input
    id: title
    attributes:
      label: Titre de la ressource
      placeholder: Titre tel que publié à la source
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: URL de la source originale
      placeholder: https://...
    validations:
      required: true
  - type: input
    id: creator
    attributes:
      label: Auteur, chaîne ou organisme à la source
      description: Indiquez la personne, la chaîne ou l'organisme qui publie réellement la ressource. Une plateforme d'hébergement comme YouTube n'est généralement pas l'auteur.
      placeholder: Nom de l'auteur, de la chaîne ou de l'organisme
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Catégorie
      options:
        - Vidéo
        - Podcast
        - Article
        - Fiche
        - Cours
        - Autre
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Langue
      description: Code ou nom de langue de la ressource originale.
      placeholder: fr
    validations:
      required: true
  - type: textarea
    id: educational
    attributes:
      label: Apport pédagogique
      description: Décrivez le contenu publié et son utilité de façon factuelle, sans exemple personnel.
    validations:
      required: true
  - type: textarea
    id: rights
    attributes:
      label: Conditions d'accès et de réutilisation
      description: Lien libre, payant, licence connue ou information à vérifier. Aucun fichier média.
  - type: checkboxes
    id: privacy
    attributes:
      label: Données personnelles et droits
      options:
        - label: Je confirme que cette proposition ne contient aucune donnée personnelle ou confidentielle d'un tiers et que je propose un lien, pas une copie non autorisée.
          required: true
