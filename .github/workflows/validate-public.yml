name: Validate public site
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/pensees.js
      - name: Validate public files and privacy boundary
        run: python3 scripts/validate_public.py
